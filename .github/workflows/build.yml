name: Universal APK Builder & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find, Extract, and Handle Nested ZIP
        run: |
          ZIP=""; BEST=0
          for z in ./*.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            if [ -z "$ZIP" ] || [ "$t" -gt "$BEST" ]; then ZIP="$z"; BEST="$t"; fi
          done

          if [ -z "$ZIP" ]; then echo "ZIP tidak ditemukan!"; exit 1; fi
          echo "Menggunakan ZIP: $ZIP"
          
          # Simpan nama ZIP asli (tanpa .zip) sebagai cadangan nama aplikasi
          FALLBACK_NAME=$(basename "$ZIP" .zip | tr -d ' ')
          
          mkdir -p ./temp_project
          unzip -q "$ZIP" -d ./temp_project
          
          find ./temp_project -maxdepth 3 -name "*.zip" -exec unzip -q -o {} -d ./temp_project \;
          
          SETTINGS=$(find ./temp_project -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle tidak ditemukan!"; exit 1; fi
          PROJ_DIR=$(dirname "$SETTINGS")
          
          # Deteksi Nama Aplikasi dari settings.gradle / fallback ke nama ZIP
          APP_NAME=$(grep -rhoE 'rootProject.name *= *["'\''][^"'\'']+["'\'']' "$PROJ_DIR/settings.gradle"* 2>/dev/null | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
          if [ -z "$APP_NAME" ]; then
            APP_NAME="$FALLBACK_NAME"
          fi
          # Bersihkan spasi dari nama aplikasi agar aman jadi nama file
          APP_NAME=$(echo "$APP_NAME" | tr -d ' ')

          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean and Build Debug & Release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug assembleRelease
          else
            gradle clean assembleDebug assembleRelease
          fi

      - name: Find, Auto-Sign Release, Rename, and Extract Version
        id: ver
        working-directory: ${{ env.PROJ_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # 1. Ambil Version Name dari build.gradle
          VN=$(grep -rhoE 'versionName *= *"[^"]+"' --include=build.gradle.kts --include=build.gradle . | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VN=${VN:-1.0} # Default 1.0 jika tidak ketemu
          RUN_NUM=${{ github.run_number }}
          APP_NAME="${{ env.APP_NAME }}"
          
          echo "Memproses Aplikasi: $APP_NAME Versi $VN"
          
          # 2. Cari dan Rename APK Debug
          DEBUG_APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then 
            cp "$DEBUG_APK" "$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-debug-${RUN_NUM}.apk"
          fi

          # 3. Cari, Auto-Sign (jika unsigned), dan Rename APK Release
          RELEASE_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            OUT_RELEASE="$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-release-${RUN_NUM}.apk"
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)

            if [ -z "$BT_DIR" ] && [ -n "$SDK_ROOT" ]; then
              SDKMAN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
              if [ -n "$SDKMAN" ]; then
                yes | "$SDKMAN" "build-tools;34.0.0" >/dev/null || true
                BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
              fi
            fi

            if [ -n "$BT_DIR" ] && [ -x "$BT_DIR/apksigner" ]; then
              if "$BT_DIR/apksigner" verify "$RELEASE_APK" >/dev/null 2>&1; then
                echo "APK Release sudah ter-sign, langsung disalin."
                cp "$RELEASE_APK" "$OUT_RELEASE"
              else
                echo "APK Release masih unsigned! Menjalankan zipalign + apksigner..."
                ALIGNED_APK="/tmp/release-aligned.apk"
                if [ -x "$BT_DIR/zipalign" ]; then
                  "$BT_DIR/zipalign" -p -f 4 "$RELEASE_APK" "$ALIGNED_APK"
                else
                  cp "$RELEASE_APK" "$ALIGNED_APK"
                fi

                if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
                  echo "Menandatangani dengan Keystore Permanen (GitHub Secrets)."
                  printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > /tmp/release.jks
                  export KS_PATH="/tmp/release.jks"
                  export KS_PASS="$KEYSTORE_PASS"
                  export KS_ALIAS="$KEY_ALIAS"
                  export K_PASS="${KEY_PASS:-$KEYSTORE_PASS}"
                else
                  echo "Secrets tidak diset -> menggunakan debug.keystore otomatis."
                  if [ ! -f "$HOME/.android/debug.keystore" ]; then
                    mkdir -p "$HOME/.android"
                    keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
                      -storepass android -alias androiddebugkey -keypass android \
                      -keyalg RSA -keysize 2048 -validity 10000 \
                      -dname "CN=Android Debug,O=Android,C=US"
                  fi
                  export KS_PATH="$HOME/.android/debug.keystore"
                  export KS_PASS="android"
                  export KS_ALIAS="androiddebugkey"
                  export K_PASS="android"
                fi

                "$BT_DIR/apksigner" sign \
                  --ks "$KS_PATH" \
                  --ks-pass env:KS_PASS \
                  --ks-key-alias "$KS_ALIAS" \
                  --key-pass env:K_PASS \
                  --out "$OUT_RELEASE" \
                  "$ALIGNED_APK"

                "$BT_DIR/apksigner" verify "$OUT_RELEASE"
                echo "APK Release berhasil di-sign dan diverifikasi!"
                rm -f /tmp/release.jks "$ALIGNED_APK"
              fi
            else
              echo "Peringatan: apksigner tidak ditemukan, menyalin APK apa adanya."
              cp "$RELEASE_APK" "$OUT_RELEASE"
            fi
          fi

          # 4. Simpan Tag Rilis
          echo "APP_VER=v${VN}-${RUN_NUM}" >> $GITHUB_OUTPUT

          # 5. Validasi
          if [ ! -f "$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-debug-${RUN_NUM}.apk" ] && [ ! -f "$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-release-${RUN_NUM}.apk" ]; then 
            echo "Kedua APK gagal dibuat!"; exit 1; 
          fi

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.APP_VER }}
          name: "${{ env.APP_NAME }} ${{ steps.ver.outputs.APP_VER }}"
          files: |
            ${{ github.workspace }}/${{ env.APP_NAME }}-v*-debug-*.apk
            ${{ github.workspace }}/${{ env.APP_NAME }}-v*-release-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
